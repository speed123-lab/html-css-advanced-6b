<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>from lesson 6</title>
</head>
<body>
    <form>
        <fieldset>

            <legend>Personal information</legend>
        <label for="firstname">First Name:</label>
        <input type="text">
        <br>
        <label for="lastname">Last Name:</label>
        <input type="text" name="lastname" id="lastname" placeholder="sheno mbiemrin">
        <br>
        <label for="email">Email:</label>
        <input type="email" name="email" id="email" readonly value="9">
        <br>
        <label for="password">password</label>
        <input type="password" name="password" id="password" disabled size="10">
        <br>
        <label>Gender</label>
        <br>
        <input type="radio" name="male" id="male" value="male">
        <label for="male">Male</label>
        <br>
        <input type="radio" name="female" id="female" value="female">
        <label for="female">female</label>
        <br>
        <label for="female">Hobbies</label>
        <br>
        <input type="checkbox" id="gaming" name="gaming" value="gaming">
        <label for="gaming">Gaming</label>
        <br>
        <input type="checkbox" id="football" name="football" value="football">
        <label for="football">football</label>
        <br>
        <input type="checkbox" id="swimming" name="swimming" value="swimming">
        <label for="swimming">swimming</label>
        <br>

        <select name="pet" id="pet">
            <option value="dog">dog</option>
            <option value="cat">cat</option>
            <option value="parrot">parrot</option>

        </select>


        <br>
        <br>
        <textarea name="message" rows="10" maxlength="10" id="message"></textarea>



        <br>



        <input type="submit">
        </fieldset>
    </form>

    
</body>
</html>
