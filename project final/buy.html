<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <h1>MotorZone</h1>
        <p>Your dream motor stars here</p>
    </header>

    <section class="hero">
        <h2>Order your<span>Dream motor</span></h2>
        <p>Complete the form below and take the first step towards your new car.</p>
    </section>

    <div class="container">

        <h3>Costumer Information</h3>

        <form id="orderForm">

            <div class="form-grid">

                <div class="form group">
                    <label>First Name</label>
                    <input type="text" placeholder="Enter your first name" required>
                </div>

                <div class="form-group">
                    <label>Last Name</label>
                    <input type="text" placeholder="Enter your last name" required>
                </div>

                <div class="form-group">
                    <label>Phone Number</label>
                    <input type="tel" placeholder="example@gmail.com" required>
                </div>

                <div class="form-group">
                    <label>City</label>
                    <input type="text" placeholder="Enter your city" required>
                </div>

                <div class="form-group">
                    <label>Address</label>
                    <input type="text" placeholder="Enter your address" required>
                </div>


                <div class="form-group full">
                    <label>Select your dream motor</label>
                    <select required>
                        <option value="">Choose your motor</option>
                        <option>Kawasaki Ninja H2R</option>
                        <option>Aprilia RS 457</option>
                        <option>Yamaha YZF-R1</option>
                        <option>Kawasaki Ninja 1000Sx</option>
                    </select>
                </div>

                <div class="form-group full">
                    <label>Additional Information</label>
                    <textarea placeholder="Write any Additional Information here..."></textarea> 
                </div>

            </div>

            <div class="confirm">
                <input type="checkbox" id="agree" required>
                <label for="agree">
                    I confirm that the information provided is correct.
                </label>
            </div>

            <button type="submit"> Confirm Your Order</button>

            <p id="message"></p>

        </form>
    </div>



                

                


                
    



    
</body>
</html>
