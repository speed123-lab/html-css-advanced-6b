<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Build Yours | Velocity Moto</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="form-page">
    <header class="site-header solid-header">
        <nav class="navbar" aria-label="Main navigation">
            <a class="brand" href="index.html"><span class="brand-mark">VM</span><span>VELOCITY MOTO</span></a>
            <button class="menu-toggle" type="button" aria-expanded="false" aria-controls="navLinks"><span></span><span></span><span></span></button>
            <ul class="nav-links" id="navLinks">
                <li><a href="index.html">Home</a></li>
                <li><a href="home.html">Models</a></li>
                <li><a class="active" href="buy.html">Build yours</a></li>
            </ul>
        </nav>
    </header>

    <main class="enquiry-layout">
        <section class="enquiry-visual">
            <div class="enquiry-overlay"></div>
            <div>
                <p class="eyebrow"><span></span> Personal consultation</p>
                <h1>Start your<br><em>journey.</em></h1>
            </div>
        </section>

        <section class="enquiry-form-wrap">
            <div class="form-heading">
                <p>02 / Enquiry</p>
                <h2>Build your motorcycle</h2>
            </div>
            <form id="orderForm">
                <div class="form-row">
                    <label>First name<input type="text" name="firstName" placeholder="Alex" required></label>
                    <label>Last name<input type="text" name="lastName" placeholder="Morgan" required></label>
                </div>
                <div class="form-row">
                    <label>Email address<input type="email" name="email" placeholder="alex@example.com" required></label>
                    <label>Phone number<input type="tel" name="phone" placeholder="+383 00 000 000" required></label>
                </div>
                <label>Selected model
                    <select name="model" id="modelSelect" required>
                        <option value="">Choose a motorcycle</option>
                        <option value="H2R">Kawasaki Ninja H2R</option>
                        <option value="RS 457">Aprilia RS 457</option>
                        <option value="R1">Yamaha YZF-R1</option>
                        <option value="Ninja 1000SX">Kawasaki Ninja 1000SX</option>
                    </select>
                </label>
                <label>Additional information<textarea name="message" rows="4" placeholder="Tell us about your preferred colour, accessories or visit date."></textarea></label>
                <label class="checkbox-row"><input type="checkbox" required><span>I agree to be contacted about this enquiry.</span></label>
                <button class="button button-primary form-submit" type="submit">Send enquiry <span>→</span></button>
                <p class="form-message" id="message" role="status"></p>
            </form>
        </section>
    </main>
    <script src="js/main.js"></script>
</body>
</html>
